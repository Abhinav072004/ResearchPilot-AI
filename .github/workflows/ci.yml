name: Verify and package
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt pytest pip-audit
      - run: python -m pytest -q && python -m evaluation.retrieval_benchmark
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: frontend
      - run: pip-audit -r backend/requirements.txt
      - run: npm audit --audit-level=high
        working-directory: frontend
      - name: Verify Compose
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180
          cd backend
          python -m evaluation.http_smoke http://localhost:8080 --large-corpus
      - name: Check deployed database models
        run: docker compose exec -T api alembic check
      - name: Collect deployment output
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down -v

  images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
