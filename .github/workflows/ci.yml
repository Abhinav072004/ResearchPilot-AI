name: Verify and package
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
  workflow_dispatch:
    inputs:
      production:
        description: Deploy verified images to the production GitHub Environment
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: pip install -r backend/requirements.txt pytest pip-audit
      - run: python -m pytest -q && python -m evaluation.retrieval_benchmark
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: frontend
      - run: pip-audit -r backend/requirements.txt
      - run: npm audit --audit-level=high
        working-directory: frontend
      - name: Verify Compose
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180
          cd backend
          python -m evaluation.http_smoke http://localhost:8080 --large-corpus
      - name: Check deployed database models
        run: docker compose exec -T api alembic check
      - name: Deploy and test a disposable production HTTPS stack
        run: infrastructure/deployment/verify-integrations.sh
      - name: Collect deployment output
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down -v

  scholarly:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r backend/requirements.txt
      - working-directory: backend
        run: python -m evaluation.live_integrations

  research-benchmark:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r backend/requirements.txt -r backend/requirements-eval.txt
      - name: Download AI2 SciFact development data
        run: curl --proto '=https' --fail --location --retry 3 --max-time 120 https://scifact.s3-us-west-2.amazonaws.com/release/latest/data.tar.gz --output "$RUNNER_TEMP/scifact.tar.gz"
      - name: Measure lexical, structural, graph, dense and hybrid retrieval
        shell: bash
        working-directory: backend
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python -m evaluation.scifact "$RUNNER_TEMP/scifact.tar.gz" --dense | tee "$RUNNER_TEMP/scifact-metrics.json"
      - uses: actions/upload-artifact@v4
        with:
          name: scifact-metrics
          path: ${{ runner.temp }}/scifact-metrics.json

  images:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.production))
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.registry.outputs.base }}/backend@${{ steps.api.outputs.digest }}
      frontend_image: ${{ steps.registry.outputs.base }}/frontend@${{ steps.gateway.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve registry path
        id: registry
        run: printf 'base=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: api
        with:
          context: backend
          push: true
          tags: ${{ steps.registry.outputs.base }}/backend:sha-${{ github.sha }}
      - uses: docker/build-push-action@v6
        id: gateway
        with:
          context: frontend
          push: true
          tags: ${{ steps.registry.outputs.base }}/frontend:sha-${{ github.sha }}

  deploy:
    if: (github.ref == 'refs/heads/main' && inputs.production) || (startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_ON_TAG == 'true')
    needs: [images, scholarly]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: researchpilot-production
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Roll out verified image digests
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          API_IMAGE: ${{ needs.images.outputs.api_image }}
          FRONTEND_IMAGE: ${{ needs.images.outputs.frontend_image }}
        run: infrastructure/deployment/github-deploy.sh
