services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: researchpilot
      POSTGRES_USER: researchpilot
      POSTGRES_PASSWORD: fixture-only
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "researchpilot"]
      interval: 3s
      retries: 15

  redis:
    image: redis:7-alpine

  object-store:
    image: motoserver/moto:5.1.10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 20

  scanner:
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"

  gateway:
    ports: !override ["127.0.0.1:${RP_TEST_HTTPS_PORT:-14443}:443"]
